name: in-game tests

# Runs the end-to-end scenarios in a real Minecraft client (about 5 minutes).
# Manual for now: trigger it from the Actions tab, or on a pull request with the "run-gametest" label.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  gametest:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-gametest'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils
      - name: Extract Baritone's nested jar for the dev runtime
        run: unzip -j libs/baritone-api-fabric-1.17.0.jar META-INF/jars/nether-pathfinder-1.6.jar -d libs
      - name: Run in-game tests
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-screenshots
          path: build/run/clientGameTest/screenshots/
