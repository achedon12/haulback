name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: haulback
          path: build/libs/*.jar
