name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation in game where Haulback falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself
