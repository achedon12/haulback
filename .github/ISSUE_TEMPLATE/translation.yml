name: Translation
description: Add or fix a language
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: The easiest way is a pull request editing `src/main/resources/assets/haulback/lang/`. See CONTRIBUTING.md. You can also paste corrections here.
  - type: input
    id: language
    attributes:
      label: Language and locale code
      placeholder: German (de_de)
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Translation or corrections
